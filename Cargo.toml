[package]
name = "cosmic-applet-fortivpn"
version = "0.1.0"
edition = "2024"
description = "COSMIC panel applet for Fortinet SSL VPN with SAML login, using openfortivpn"
license = "GPL-3.0-only"

[dependencies]
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustix = { version = "1.1", features = ["fs", "net", "process"] }
sha2 = "0.10"
tokio = { version = "1.49", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
x509-parser = "0.17"
zbus = { version = "5.15", default-features = false, features = ["tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Only the login binary uses these: WebKitGTK for the SAML login window.
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
# Same revision as cosmic-applets uses, so the applet API matches the panel.
rev = "5a8bd9482a35ae94c1e54edf77b331c6b970f170"
default-features = false
features = ["applet", "applet-token", "dbus-config", "multi-window", "tokio", "wayland", "winit"]

[profile.release]
lto = "thin"
